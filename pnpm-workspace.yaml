packages:
  - "apps/*"
  - "packages/*"

# Hoisted from the app create-next-app generated. pnpm blocks dependency build
# scripts by default; these two are the ones the Next.js template opts out of.
# They belong at the workspace root — a second pnpm-workspace.yaml inside
# apps/web would make pnpm treat it as its own workspace root and detach it from
# this one.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
